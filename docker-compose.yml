services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finbot}
      POSTGRES_USER: ${POSTGRES_USER:-finbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finbot} -d ${POSTGRES_DB:-finbot}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./credentials:/app/credentials:ro

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"

  dashboard:
    build:
      context: ../couples-fin-dashboard
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: "http://api:8000"
    environment:
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
